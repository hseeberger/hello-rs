[package]
name          = "hello-rs"
description   = "Simple dockerized Rust/axum based HTTP server for demo purposes"
version       = "0.7.1"
edition       = "2024"
license       = "Apache-2.0"
readme        = "README.md"
homepage      = "https://github.com/hseeberger/hello-rs"
repository    = "https://github.com/hseeberger/hello-rs"
documentation = "https://github.com/hseeberger/hello-rs"
publish       = false

[dependencies]
anyhow             = { version = "1.0", features = [ "backtrace" ] }
api-version        = { version = "0.3" }
axum               = { version = "0.8", features = [ "http2", "json" ] }
configured         = { version = "0.9" }
serde              = { version = "1.0", features = [ "derive" ] }
tokio              = { version = "1", features = [ "macros", "rt-multi-thread", "signal" ] }
tower              = { version = "0.5" }
tracing            = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = [ "env-filter", "fmt", "json" ] }
